name: RHZIN Otimizador APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK manualmente
        shell: bash
        run: |
          set -e

          SDK="$ANDROID_HOME"
          TOOLS="$SDK/cmdline-tools/latest"

          mkdir -p "$SDK/cmdline-tools"

          if [ ! -x "$TOOLS/bin/sdkmanager" ]; then
            mkdir -p /tmp/android-tools
            cd /tmp/android-tools

            curl -fL \
              "https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip" \
              -o tools.zip

            unzip -q tools.zip
            mkdir -p "$TOOLS"
            cp -R cmdline-tools/. "$TOOLS/"
          fi

          echo "$TOOLS/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          yes | "$TOOLS/bin/sdkmanager" --licenses || true

          "$TOOLS/bin/sdkmanager" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar projeto Android
        shell: bash
        run: |
          set -e

          GRADLE_FILE=$(find . -maxdepth 6 -type f \
            \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)

          if [ -z "$GRADLE_FILE" ]; then
            echo "ERRO: settings.gradle nao encontrado."
            echo "Arquivos encontrados:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLE_FILE")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projeto encontrado: $PROJECT_DIR"

      - name: Compilar aplicativo
        shell: bash
        run: |
          set -e

          cd "$PROJECT_DIR"

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERRO: modulo app nao encontrado."
            exit 1
          fi

          gradle --no-daemon :app:assembleDebug

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERRO: APK nao foi gerado."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/RHZIN-Otimizador.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: 'RHZIN-Otimizador-apk'
          path: 'output/RHZIN-Otimizador.apk'
          if-no-files-found: error
          retention-days: 30
