name: RHZIN Otimizador APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p /tmp/android-tools
            cd /tmp/android-tools
            curl -fL https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip -o tools.zip
            unzip -q tools.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -R cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          fi
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar aplicativo
        run: gradle --no-daemon :app:assembleDebug

      - name: Verificar APK
        run: test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Preparar APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/RHZIN-Otimizador.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RHZIN-Otimizador-apk
          path: output/RHZIN-Otimizador.apk
          if-no-files-found: error
          retention-days: 30
