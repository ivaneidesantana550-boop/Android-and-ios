name: Gerar APK RHZIN Otimizador

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar aplicativo
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/RHZIN-Otimizador.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RHZIN-Otimizador-apk
          path: output/RHZIN-Otimizador.apk
          if-no-files-found: error
          retention-days: 30
