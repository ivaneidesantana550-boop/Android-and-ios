name: RHZIN Otimizador APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_HOME/cmdline-tools"

          if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p /tmp/android-tools
            cd /tmp/android-tools

            curl -fL \
              https://dl.google.com/android/repository/commandlinetools-linux-12266719_latest.zip \
              -o tools.zip

            unzip -q tools.zip

            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            cp -R cmdline-tools/. "$ANDROID_HOME/cmdline-tools/latest/"
          fi

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Localizar e compilar aplicativo
        shell: bash
        run: |
          set -e

          echo "Procurando projeto Android..."

          GRADLE_DIR=""

          while IFS= read -r FILE; do
            if [ "$(basename "$FILE")" = "settings.gradle" ] || \
               [ "$(basename "$FILE")" = "settings.gradle.kts" ]; then
              GRADLE_DIR="$(dirname "$FILE")"
              break
            fi
          done < <(
            find . -maxdepth 6 -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*'
          )

          if [ -z "$GRADLE_DIR" ]; then
            echo "ERRO: projeto Gradle nao encontrado."
            echo "Arquivos encontrados no repositorio:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Pasta do projeto: $GRADLE_DIR"
          cd "$GRADLE_DIR"

          if [ ! -f "app/build.gradle" ] && \
             [ ! -f "app/build.gradle.kts" ]; then
            echo "ERRO: modulo app nao encontrado."
            echo "Verifique se existe a pasta app com build.gradle ou build.gradle.kts."
            exit 1
          fi

          gradle --no-daemon :app:assembleDebug

          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERRO: APK nao foi gerado."
            find . -type f -name "*.apk"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK_PATH" "$GITHUB_WORKSPACE/output/RHZIN-Otimizador.apk"

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: RHZIN-Otimizador-apk
          path: output/RHZIN-Otimizador.apk
          if-no-files-found: error
          retention-days: 30
