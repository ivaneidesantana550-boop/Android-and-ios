name: RHZIN Otimizador APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Aceitar licencas
        shell: bash
        run: |
          sdkmanager --licenses <<EOF
          y
          y
          y
          y
          y
          y
          y
          y
          y
          y
          EOF

      - name: Instalar Android 35
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Preparar APK
        run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/RHZIN-Otimizador.apk

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: RHZIN-Otimizador-apk
          path: output/RHZIN-Otimizador.apk
          if-no-files-found: error
